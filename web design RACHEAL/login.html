<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MUST Portal - Login</title>
<link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="portal-wrapper">
        <!--Left side branding-->
        <div  class="brand-panel">

        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/8c/Mbarara_University_Of_Science_And_Technology_Logo.png/180px-Mbarara_University_Of_Science_And_Technology_Logo.png"alt="MUST Logo">
<h1>Mbarara University Of Science And Technology</h1>
<p>Empowering Innovators for the future</p>
<span class="badge">Online Application Portal</span>

    </div>
    <!--Right side login form-->
    <div class="form-panel">
        <h2>Welcome Back</h2>
<p class="subtitle">Please login to continue your application.</p>
<form action="#">
    <div class="input-group">
        <label>Email Adress</label>
        <input type="email" placeholder="e.g. student@must.std.ac.ug" required>
    </div>
    <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn">SignIn</button>
    <div class="links">
        <a href="#">Forgot password</a>
        <br><br>
        Don't have an account <a href="signup.html">Create Account</a>
    </div>
</form>
</div>
</div>
</body>

</html>

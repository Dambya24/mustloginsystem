<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>MUST Portal - Create Account</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="portal-wrapper">
            <!--Left side branding-->
        <div class="brand-panel">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/8c/Mbarara_University_Of_Science_And_Technology_Logo.png/180px-Mbarara_University_Of_Science_And_Technology_Logo.png" alt="MUST Logo">
        <h1>Mbarara University Of Science And Technology</h1>
        <p>Join our community of innovators today.</p>
        <span class="badge">Online Application Portal</span>
        </div>
        <!--Right side Signup form-->
        <div class="form-panel">
            <h2>Create Account</h2>
            <p class="subtitle">Register to start your application process.</p>
            <form action="#">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="e.g student@must.std.ac.ug"required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a strong password" required>
                </div>
                <button type="submit" class="btn">SignUp</button>
                <div class="links">
                    Already have an account <a href="login.html">Login Here</a>

                </div>
        </form>
    </div>
</div>
    </body>
</html>
